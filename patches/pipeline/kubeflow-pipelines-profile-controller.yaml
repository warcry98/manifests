apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-pipelines-profile-controller
spec:
  template:
    spec:
      containers:
      - name: kubeflow-pipelines-profile-controller
        resources:
          requests:
            cpu: 1600m
            memory: 4096Mi
          limits:
            cpu: 3200m
            memory: 8192Mi
